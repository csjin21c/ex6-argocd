# 워크플로우 이름
name: GitOps ArgoCD CI/CD Pipeline

# 트리거 설정: main 브랜치에 푸시될 때 실행
on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    # GitHub Actions에서 Git에 커밋/푸시를 수행하기 위한 권한 설정
    permissions:
      contents: write

    steps:
    - name: 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: Docker Hub 로그인
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Docker 이미지 빌드 및 푸시
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./nginx/Dockerfile
        push: true
        # GitHub Commit SHA를 태그로 사용하여 매번 고유한 이미지 버전 생성
        tags: csjin21c/nginx:${{ github.sha }}

    - name: 쿠버네티스 매니페스트 이미지 태그 갱신 및 Git 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # k8s/deployment.yaml 파일 내의 이미지 태그를 현재 커밋 SHA 버전으로 변경
        # (사용하시는 deployment.yaml 파일의 경로에 맞게 수정해주세요)
        sed -i 's|image: csjin21c/nginx:.*|image: csjin21c/nginx:${{ github.sha }}|g' k8s/deployment.yaml

        git add k8s/deployment.yaml
        git commit -m "Update image tag to ${{ github.sha }} [skip ci]"
        git push