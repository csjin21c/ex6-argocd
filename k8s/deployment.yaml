apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-web-lb
  template:
    metadata:
      labels:
        app: nginx-web-lb
    spec:
      containers:
        - name: nginx-container
          image: csjin21c/nginx:9f01d06d5f26bf9763c41d48463afe5bff9ccf31
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: default

spec:
  type: LoadBalancer
  selector:
    app: nginx-web-lb
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80










