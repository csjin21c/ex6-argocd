apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-web-lb
  template:
    metadata:
      labels:
        app: nginx-web-lb
    spec:
      containers:
        - name: nginx-container
          image: csjin21c/nginx:a26d4bcc31bb828bfced186a181c13556457d069
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: default

spec:
  type: LoadBalancer
  selector:
    app: nginx-web-lb
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80










